{% load static %}<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}الحساب والطلبات{% endblock %}</title><link rel="stylesheet" href="{% static 'commerce.css' %}"></head><body><header><a href="/">الحجوزات</a><nav><a href="/">الرئيسية</a><a href="/bookings/">حجوزاتي</a>{% if user.is_authenticated %}<a href="{% url 'accounts:profile' %}">حسابي</a><form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button>تسجيل الخروج</button></form>{% else %}<a href="{% url 'accounts:login' %}">تسجيل الدخول</a><a href="{% url 'accounts:signup' %}">إنشاء حساب</a>{% endif %}</nav></header><main>{% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
